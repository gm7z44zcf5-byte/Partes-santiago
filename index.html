<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Parte De Santiago Román</title>

<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#111;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:#f2f2f7;
}
.wrap{
  max-width:900px;
  margin:auto;
  padding:16px;
}
h1{
  text-align:center;
  margin:8px 0 4px;
  font-size:28px;
}
.sub{
  text-align:center;
  color:#666;
  margin-bottom:18px;
}
.card{
  background:#fff;
  border-radius:20px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 2px 12px #00000010;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}
label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:5px;
}
input,select,button{
  width:100%;
  font:inherit;
  border-radius:13px;
  padding:13px;
  border:1px solid #ccc;
  background:#fff;
}
button{
  border:0;
  background:#111;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}
.green{background:#16843d}
.gray{background:#777}
.danger{background:#b42318}

.week-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:12px;
}
.day{
  border-top:1px solid #eee;
  padding:12px 0;
}
.day:first-child{border-top:0}
.day-header{
  display:grid;
  grid-template-columns:1.5fr .7fr 1.5fr;
  gap:8px;
  align-items:center;
}
.date{
  font-weight:800;
}
.obs{
  font-size:13px;
  color:#777;
  margin-top:5px;
}
.total{
  text-align:right;
  font-size:20px;
  font-weight:800;
  margin-top:12px;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}
.hidden{display:none}
.msg{
  padding:12px;
  border-top:1px solid #eee;
}
.mode{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .day-header{
    grid-template-columns:1.3fr .7fr 1.2fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

<h1>📋 PARTE DE SANTIAGO ROMÁN</h1>
<div class="sub">Registro semanal de horas de trabajo</div>

<div class="card">

<div class="grid">

<div>
<label>Nombre</label>
<input id="nombre" value="Santiago Román">
</div>

<div>
<label>Mes</label>
<select id="mes">
<option>Enero</option>
<option>Febrero</option>
<option>Marzo</option>
<option>Abril</option>
<option>Mayo</option>
<option>Junio</option>
<option>Julio</option>
<option>Agosto</option>
<option>Septiembre</option>
<option>Octubre</option>
<option>Noviembre</option>
<option>Diciembre</option>
</select>
</div>

<div>
<label>Año</label>
<input id="ano" type="number" value="2026">
</div>

</div>

</div>

<div class="card">

<h2>Crear semana</h2>

<div class="grid">

<div>
<label>Fecha inicial</label>
<input id="inicio" type="date">
</div>

<div>
<label>Horas por día</label>
<input id="horas" type="number" value="8">
</div>

<div>
<label>Obra</label>
<select id="obra"></select>
</div>

</div>

<br>

<div class="mode">
<button class="green" onclick="crearSemana()">Crear semana rápidamente</button>
<button onclick="limpiarSemana()">Limpiar</button>
</div>

</div>

<div class="card">

<div class="week-title">Parte semanal</div>

<div id="resultado">
<div class="msg">Crea una semana para empezar.</div>
</div>

</div>

<div class="card">

<h2>Añadir otra obra</h2>

<p class="sub">La añades una vez y aparecerá en todos los selectores.</p>

<div class="grid">

<input id="nuevaObra" placeholder="N.º de obra">

<button onclick="anadirObra()">AÑADIR OBRA</button>

</div>

</div>

<div class="card">

<h2>Datos guardados</h2>

<button class="danger" onclick="borrarDatos()">Borrar todos los datos</button>

</div>

</div>

<script>

let obras = JSON.parse(localStorage.getItem("obrasSantiago") || "[]");

function cargarObras(){

  const select=document.getElementById("obra");

  select.innerHTML="";

  if(obras.length===0){
    const op=document.createElement("option");
    op.value="";
    op.textContent="Añade una obra";
    select.appendChild(op);
    return;
  }

  obras.forEach(obra=>{
    const op=document.createElement("option");
    op.value=obra;
    op.textContent=obra;
    select.appendChild(op);
  });
}

function anadirObra(){

  const input=document.getElementById("nuevaObra");
  const obra=input.value.trim();

  if(!obra){
    alert("Escribe el número de obra.");
    return;
  }

  if(!obras.includes(obra)){
    obras.push(obra);
    localStorage.setItem("obrasSantiago",JSON.stringify(obras));
  }

  input.value="";
  cargarObras();
  document.getElementById("obra").value=obra;
}

function crearSemana(){

  const inicio=document.getElementById("inicio").value;
  const horas=document.getElementById("horas").value;
  const obra=document.getElementById("obra").value;

  if(!inicio){
    alert("Selecciona la fecha inicial.");
    return;
  }

  if(!obra){
    alert("Añade primero una obra.");
    return;
  }

  const fecha=new Date(inicio+"T12:00:00");

  let total=0;
  let html="";

  const dias=[
    "Lunes",
    "Martes",
    "Miércoles",
    "Jueves",
    "Viernes",
    "Sábado",
    "Domingo"
  ];

  for(let i=0;i<7;i++){

    const d=new Date(fecha);
    d.setDate(fecha.getDate()+i);

    const dia=d.getDay();

    if(dia===0 || dia===6){
      html+=`
      <div class="day">
        <div class="date">${dias[i]}</div>
        <div class="obs">Fin de semana</div>
      </div>`;
      continue;
    }

    total+=Number(horas);

    const numero=d.getDate();
    const mes=d.toLocaleDateString("es-ES",{month:"long"});

    html+=`
    <div class="day">

      <div class="day-header">

        <div>
          <div class="date">${dias[i]}, ${numero} de ${mes}</div>
        </div>

        <div>
          <input class="horaDia" type="number" value="${horas}" min="0"
          onchange="actualizarTotal()">
        </div>

        <div>
          <select class="obraDia">
            ${obras.map(o=>`
              <option ${o===obra?"selected":""}>${o}</option>
            `).join("")}
          </select>
        </div>

      </div>

      <div class="obs">
        Observaciones:
        <input placeholder="Observaciones">
      </div>

    </div>`;
  }

  html+=`
  <div class="total">
    Total: <span id="totalHoras">${total}</span> horas
  </div>

  <div class="actions">
    <button class="green" onclick="imprimirParte()">
      🖨️ IMPRIMIR / GUARDAR PDF
    </button>

    <button onclick="guardarParte()">
      💾 GUARDAR PARTE
    </button>
  </div>
  `;

  document.getElementById("resultado").innerHTML=html;

  actualizarTotal();
}

function actualizarTotal(){

  let total=0;

  document.querySelectorAll(".horaDia").forEach(input=>{
    total+=Number(input.value)||0;
  });

  const el=document.getElementById("totalHoras");

  if(el) el.textContent=total;
}

function limpiarSemana(){
  document.getElementById("resultado").innerHTML=
  '<div class="msg">Crea una semana para empezar.</div>';
}

function guardarParte(){

  const datos={
    nombre:document.getElementById("nombre").value,
    mes:document.getElementById("mes").value,
    ano:document.getElementById("ano").value,
    fecha:document.getElementById("inicio").value,
    horas:document.getElementById("horas").value,
    obra:document.getElementById("obra").value
  };

  localStorage.setItem(
    "ultimoParteSantiago",
    JSON.stringify(datos)
  );

  alert("Parte guardado correctamente.");
}

function borrarDatos(){

  if(confirm("¿Seguro que quieres borrar todas las obras y datos guardados?")){
    localStorage.removeItem("obrasSantiago");
    localStorage.removeItem("ultimoParteSantiago");
    obras=[];
    cargarObras();
    alert("Datos borrados.");
  }
}

function imprimirParte(){
  window.print();
}

cargarObras();

</script>

</body>
</html>
