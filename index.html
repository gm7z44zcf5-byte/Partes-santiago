<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Parte de horas semanales</title>

<style>
:root{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
color:#111
}

*{box-sizing:border-box}

body{
margin:0;
background:#f2f3f7
}

.wrap{
max-width:850px;
margin:auto;
padding:18px 12px 50px
}

.card{
background:#fff;
border-radius:25px;
padding:22px;
margin-bottom:18px;
box-shadow:0 4px 20px #0000000d
}

h1{
text-align:center;
font-size:34px;
line-height:1.12;
margin:4px 0 8px
}

.sub{
text-align:center;
color:#666;
font-size:18px;
margin-bottom:25px
}

label{
display:block;
font-weight:800;
margin:14px 0 7px
}

input,select,button{
font:inherit
}

input,select{
width:100%;
padding:14px;
border:1.5px solid #d1d1d6;
border-radius:15px;
background:#fff;
font-size:17px;
min-height:52px
}

button{
border:0;
border-radius:15px;
padding:15px;
font-weight:800
}

.primary{
background:#3978bd;
color:#fff;
width:100%
}

.save{
background:#3e8b4b;
color:#fff;
width:100%;
margin-top:10px
}

.print{
background:#111;
color:#fff;
width:100%;
margin-top:10px
}

.secondary{
background:#eee
}

.danger{
background:#f5eeee;
color:#b42318
}

.notice{
margin-top:10px;
padding:10px 13px;
border-radius:13px;
background:#eef6ff;
color:#24527f;
font-size:14px
}

.section-title{
font-size:28px;
margin:0 0 18px
}

.day{
border-top:1px solid #e5e5e7;
padding:20px 0
}

.dayhead{
display:flex;
justify-content:space-between;
align-items:center
}

.dayname{
font-size:22px;
font-weight:850
}

.daydate{
font-size:14px;
color:#777
}

.totalpill{
background:#f0f0f2;
border-radius:22px;
padding:9px 15px;
font-size:20px;
font-weight:850
}

.worked{
display:flex;
align-items:center;
gap:9px;
font-size:17px;
margin:17px 0
}

.worked input{
width:25px;
height:25px;
min-height:0;
accent-color:#3978bd
}

.rows{
display:grid;
gap:9px
}

.row{
display:grid;
grid-template-columns:1fr 1.3fr 1.3fr 46px;
gap:7px
}

.row input{
font-size:15px;
padding:11px
}

.remove{
padding:0;
height:52px;
font-size:22px
}

.addline{
width:100%;
background:#eef0f2;
margin-top:9px
}

.saved-list{
display:grid;
gap:9px
}

.saved-item{
border:1px solid #ddd;
border-radius:14px;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
gap:8px
}

.saved-item span{
display:block;
color:#777;
font-size:13px;
margin-top:3px
}

.small{
font-size:13px;
color:#777
}

.print-area{
display:none
}

@media(max-width:600px){

h1{
font-size:31px
}

.row{
grid-template-columns:1fr 1.15fr 1.25fr 43px
}

.row input{
font-size:14px;
padding:10px
}

}

@media print{

@page{
size:A4;
margin:12mm
}

body{
background:#fff
}

.wrap{
padding:0;
max-width:none
}

.no-print{
display:none!important
}

.print-area{
display:block!important
}

.print-title{
text-align:center;
border:2px solid #111;
padding:10px;
margin-bottom:12px
}

.print-title h1{
font-size:25px;
margin:0
}

.print-meta{
display:grid;
grid-template-columns:1.5fr 1fr 1fr;
border:1.5px solid #111
}

.print-meta div{
padding:7px;
border-right:1px solid #111
}

.print-meta div:last-child{
border-right:0
}

table{
width:100%;
border-collapse:collapse;
font-size:11px
}

th,td{
border:1px solid #222;
padding:6px;
vertical-align:top
}

th{
background:#eee
}

.print-total{
text-align:right;
font-weight:900;
font-size:15px;
margin-top:8px
}

}
</style>
</head>

<body>

<div class="wrap">

<div class="card no-print">

<h1>📋 Parte de horas semanales</h1>

<div class="sub">
Control semanal de horas y obras
</div>

<label>Nombre y apellido</label>

<input
id="worker"
type="text"
placeholder="Pon tu nombre y apellido"
autocomplete="name"
>

<div class="notice">
Tu nombre queda guardado en este dispositivo y aparecerá automáticamente la próxima vez.
</div>

<label>Semana comienza</label>

<input
id="weekStart"
type="date"
>

<button
class="primary"
id="create"
>
Crear semana
</button>

<button
class="save"
id="save"
>
💾 Guardar parte
</button>

<button
class="print"
id="print"
>
🖨️ Imprimir / PDF
</button>

</div>


<div class="card no-print">

<h2 class="section-title">
Horas de la semana
</h2>

<div id="days"></div>

</div>


<div class="card no-print">

<h2 class="section-title">
Partes guardados
</h2>

<div id="saved"></div>

</div>


<div
class="print-area"
id="printArea"
></div>

</div>


<script>

const NAMES=[
"Lunes",
"Martes",
"Miércoles",
"Jueves",
"Viernes",
"Sábado",
"Domingo"
];

const NAMEKEY="parte_nombre";
const CURKEY="parte_actual";
const SAVEKEY="partes_guardados";

let S={
name:"",
weekStart:"",
days:[]
};


function pad(n){
return String(n).padStart(2,"0")
}


function iso(d){

return d.getFullYear()
+"-"
+pad(d.getMonth()+1)
+"-"
+pad(d.getDate());

}


function txt(s){

return new Date(
s+"T12:00:00"
).toLocaleDateString(
"es-ES",
{
day:"2-digit",
month:"2-digit",
year:"numeric"
}
);

}


function makeDays(start){

let d=new Date(start+"T12:00:00");

return NAMES.map((name,i)=>{

let x=new Date(d);

x.setDate(
d.getDate()+i
);

return{

date:iso(x),

name:name,

worked:i<5,

lines:[
{
hours:"",
obra:"",
obs:""
}
]

};

});

}


function dayTotal(d){

return d.worked
?
d.lines.reduce(
(a,x)=>a+(parseFloat(x.hours)||0),
0
)
:
0;

}


function total(){

return S.days.reduce(
(a,d)=>a+dayTotal(d),
0
);

}


function persist(){

localStorage.setItem(
CURKEY,
JSON.stringify(S)
);

if(S.name){

localStorage.setItem(
NAMEKEY,
S.name
);

}

}


function render(){

const box=document.getElementById("days");

box.innerHTML="";


S.days.forEach((d,di)=>{

let el=document.createElement("div");

el.className="day";


el.innerHTML=

'<div class="dayhead">'+

'<div>'+

'<div class="dayname">'+
d.name+
'</div>'+

'<div class="daydate">'+
txt(d.date)+
'</div>'+

'</div>'+

'<div class="totalpill">'+
dayTotal(d)+
' h</div>'+

'</div>'+

'<label class="worked">'+

'<input type="checkbox" '+
(d.worked?"checked":"")+
' data-w="'+di+'">'+

' Trabajé este día'+

'</label>'+

'<div class="rows" id="r'+di+'"></div>'+

'<button class="addline" data-a="'+di+'">'+
'＋ Añadir otra obra / línea'+
'</button>';


box.appendChild(el);


let rows=
el.querySelector("#r"+di);


d.lines.forEach((l,li)=>{

let r=document.createElement("div");

r.className="row";


r.innerHTML=

'<input type="number" min="0" max="24" step="0.5" placeholder="Horas" value="'+
l.hours+
'">'+

'<input type="text" placeholder="N.º de obra" value="'+
l.obra+
'">'+

'<input type="text" placeholder="Observación" value="'+
l.obs+
'">'+

'<button class="remove danger">×</button>';


let ins=r.querySelectorAll("input");


ins[0].oninput=()=>{

l.hours=ins[0].value;

updateTotals();

};


ins[1].oninput=()=>{

l.obra=ins[1].value;

persist();

};


ins[2].oninput=()=>{

l.obs=ins[2].value;

persist();

};


r.querySelector(".remove").onclick=()=>{

if(d.lines.length>1){

d.lines.splice(li,1);

render();

}

};


rows.appendChild(r);

});

});


document.querySelectorAll("[data-w]").forEach(x=>{

x.onchange=()=>{

S.days[
+x.dataset.w
].worked=x.checked;

render();

};

});


document.querySelectorAll("[data-a]").forEach(x=>{

x.onclick=()=>{

S.days[
+x.dataset.a
].lines.push({
hours:"",
obra:"",
obs:""
});

render();

};

});


persist();

}


function updateTotals(){

document
.querySelectorAll(".day")
.forEach((e,i)=>{

e.querySelector(
".totalpill"
).textContent=
dayTotal(S.days[i])
+" h";

});

persist();

}


function createWeek(){

S.name=
document.getElementById(
"worker"
).value.trim();

S.weekStart=
document.getElementById(
"weekStart"
).value;


if(!S.weekStart){

alert(
"Selecciona la semana."
);

return;

}


S.days=
makeDays(
S.weekStart
);

render();

}


function savePart(){

S.name=
document.getElementById(
"worker"
).value.trim();


if(!S.name){

alert(
"Escribe tu nombre y apellido."
);

return;

}


let list=[];

try{

list=JSON.parse(
localStorage.getItem(
SAVEKEY
)||"[]"
);

}catch(e){}


list.unshift({

...S,

id:Date.now(),

total:total()

});


localStorage.setItem(
SAVEKEY,
JSON.stringify(
list.slice(0,30)
)
);


localStorage.setItem(
NAMEKEY,
S.name
);


let next=
new Date(
S.weekStart+"T12:00:00"
);

next.setDate(
next.getDate()+7
);


S={

name:S.name,

weekStart:iso(next),

days:makeDays(
iso(next)
)

};


document.getElementById(
"worker"
).value=S.name;


document.getElementById(
"weekStart"
).value=S.weekStart;


render();

showSaved();


window.scrollTo({
top:0,
behavior:"smooth"
});


alert(
"Parte guardado. Ya puedes crear el de la siguiente semana."
);

}


function esc(s){

return String(s||"")
.replace(
/[&<>"']/g,
m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m])
);

}


function buildPrint(P=S){

let rows="";


P.days.forEach(d=>{

(
d.worked
?
d.lines
:
[
{
hours:"",
obra:"",
obs:""
}
]
).forEach((l,i)=>{

rows+=

"<tr>"+

"<td>"+

(
i===0
?
"<b>"+
d.name+
"</b><br>"+
txt(d.date)
:
""
)+

"</td>"+

"<td>"+
esc(l.hours)+
"</td>"+

"<td>"+
esc(l.obra)+
"</td>"+

"<td>"+
esc(l.obs)+
"</td>"+

"</tr>";

});

});


let t=
P.days.reduce(
(a,d)=>a+dayTotal(d),
0
);


document.getElementById(
"printArea"
).innerHTML=

'<div class="print-title">'+

'<h1>PARTE DE HORAS SEMANALES</h1>'+

'</div>'+

'<div class="print-meta">'+

'<div><b>Nombre:</b><br>'+
esc(P.name)+
'</div>'+

'<div><b>Semana:</b><br>'+
txt(P.weekStart)+
'</div>'+

'<div><b>Total:</b><br>'+
t+
' horas</div>'+

'</div>'+

'<table>'+

'<thead>'+

'<tr>'+

'<th>Día</th>'+

'<th>Horas</th>'+

'<th>Obra</th>'+

'<th>Observaciones</th>'+

'</tr>'+

'</thead>'+

'<tbody>'+
rows+
'</tbody>'+

'</table>'+

'<div class="print-total">'+

'TOTAL SEMANAL: '+
t+
' HORAS'+

'</div>';

}


function showSaved(){

let box=
document.getElementById(
"saved"
);

let list=[];


try{

list=JSON.parse(
localStorage.getItem(
SAVEKEY
)||"[]"
);

}catch(e){}


if(!list.length){

box.innerHTML=
'<div class="small">'+
'Todavía no hay partes guardados en este dispositivo.'+
'</div>';

return;

}


box.innerHTML="";


list.forEach((p,i)=>{

let e=
document.createElement(
"div"
);

e.className=
"saved-item";


e.innerHTML=

'<div>'+

'<b>'+
esc(p.name)+
'</b>'+

'<span>'+
'Semana del '+
txt(p.weekStart)+
' · '+
p.total+
' horas'+
'</span>'+

'</div>'+

'<button class="secondary">'+
'Ver / imprimir'+
'</button>';


e.querySelector(
"button"
).onclick=()=>{

buildPrint(p);

window.print();

};


box.appendChild(e);

});

}


document.getElementById(
"worker"
).oninput=e=>{

S.name=
e.target.value;

localStorage.setItem(
NAMEKEY,
S.name
);

persist();

};


document.getElementById(
"create"
).onclick=
createWeek;


document.getElementById(
"save"
).onclick=
savePart;


document.getElementById(
"print"
).onclick=()=>{

buildPrint();

window.print();

};


(function init(){

let n=
localStorage.getItem(
NAMEKEY
)||"";


let c=null;


try{

c=JSON.parse(
localStorage.getItem(
CURKEY
)||"null"
);

}catch(e){}


document.getElementById(
"worker"
).value=n;


if(c&&c.days){

S=c;

document.getElementById(
"worker"
).value=
S.name||n;

document.getElementById(
"weekStart"
).value=
S.weekStart;

}

else{

let d=new Date();

d.setDate(
d.getDate()-
((d.getDay()+6)%7)
);

S={

name:n,

weekStart:iso(d),

days:makeDays(
iso(d)
)

};


document.getElementById(
"weekStart"
).value=
S.weekStart;

}


render();

showSaved();

})();

</script>

</body>
</html>
