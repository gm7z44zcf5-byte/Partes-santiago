<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Parte De Santiago Román</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f4f4f7;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.app{
  max-width:760px;
  margin:auto;
  padding:16px;
}

header{
  padding:8px 0 18px;
}

h1{
  margin:0;
  font-size:27px;
}

h2{
  margin:0 0 15px;
  font-size:19px;
}

.muted{
  color:#6b7280;
  margin-top:5px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:white;
  font:inherit;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  font:inherit;
  font-weight:700;
  cursor:pointer;
}

.green{
  background:#16843d;
  color:white;
}

.blue{
  background:#1769d1;
  color:white;
}

.dark{
  background:#111;
  color:white;
}

.light{
  background:#eef0f3;
  color:#111;
}

.red{
  background:#fee4e2;
  color:#b42318;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field{
  margin-bottom:12px;
}

.notice{
  background:#eef6ff;
  color:#174a8b;
  padding:12px;
  border-radius:12px;
  font-size:13px;
}

.day{
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:14px;
  margin-bottom:10px;
}

.day.off{
  opacity:.45;
  background:#fafafa;
}

.day-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.day-name{
  font-weight:800;
}

.check{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:13px;
  margin:0;
}

.check input{
  width:20px;
  height:20px;
}

.day-fields{
  display:grid;
  grid-template-columns:100px 1fr;
  gap:10px;
}

.total{
  display:flex;
  justify-content:space-between;
  border-top:1px solid #eee;
  padding-top:15px;
  margin-top:15px;
  font-weight:800;
}

.total-number{
  font-size:25px;
}

.week{
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:14px;
  margin-bottom:10px;
}

.week-title{
  font-weight:800;
}

.week-info{
  color:#6b7280;
  font-size:13px;
  margin-top:5px;
}

.week-buttons{
  display:grid;
  grid-template-columns:1fr 1fr 60px;
  gap:8px;
  margin-top:12px;
}

.badge{
  display:inline-block;
  background:#eee;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:20px;
}

.toast{
  position:fixed;
  left:15px;
  right:15px;
  bottom:20px;
  background:#111;
  color:white;
  padding:14px;
  border-radius:14px;
  text-align:center;
  z-index:100;
}

.hidden{
  display:none;
}

/* PDF */

.print{
  display:none;
}

@media(max-width:600px){

  .grid{
    grid-template-columns:1fr;
  }

  .day-fields{
    grid-template-columns:1fr;
  }

  .week-buttons{
    grid-template-columns:1fr;
  }

}

@media print{

  @page{
    size:A4;
    margin:12mm;
  }

  body{
    background:white;
  }

  .app{
    display:none !important;
  }

  .print{
    display:block !important;
    font-family:Arial,sans-serif;
    color:#111;
  }

  .print h1{
    text-align:center;
    font-size:22px;
    margin-bottom:15px;
  }

  .print-info{
    border:1px solid #111;
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .print-info div{
    padding:8px;
    font-size:12px;
    border-right:1px solid #111;
  }

  .print-info div:last-child{
    border-right:0;
  }

  table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
    font-size:11px;
  }

  th,
  td{
    border:1px solid #111;
    padding:7px;
    text-align:left;
  }

  th{
    background:#eee;
  }

  .print-total{
    text-align:right;
    font-weight:bold;
    margin-top:10px;
  }
}
</style>
</head>

<body>

<div id="app" class="app"></div>

<div id="print" class="print"></div>

<script>

const PARTS_KEY = "santiago_partes_final";

const WORKS_KEY = "santiago_obras_final";

const DAYS = [
  "Lunes",
  "Martes",
  "Miércoles",
  "Jueves",
  "Viernes",
  "Sábado",
  "Domingo"
];

let currentPage = "home";

let currentPart = null;

let editingId = null;


/* =========================
   UTILIDADES
========================= */

function getParts(){

  try{

    return JSON.parse(
      localStorage.getItem(PARTS_KEY)
    ) || [];

  }catch(e){

    return [];

  }

}


function saveParts(parts){

  localStorage.setItem(
    PARTS_KEY,
    JSON.stringify(parts)
  );

}


function getWorks(){

  try{

    let works = JSON.parse(
      localStorage.getItem(WORKS_KEY)
    ) || [];

    if(!works.includes("10043")){
      works.push("10043");
    }

    if(!works.includes("30339")){
      works.push("30339");
    }

    saveWorks(works);

    return works;

  }catch(e){

    return ["10043","30339"];

  }

}


function saveWorks(works){

  localStorage.setItem(
    WORKS_KEY,
    JSON.stringify(works)
  );

}


function createId(){

  return Date.now().toString(36) +
  Math.random().toString(36).substring(2);

}


function localDate(date){

  const y = date.getFullYear();

  const m = String(
    date.getMonth()+1
  ).padStart(2,"0");

  const d = String(
    date.getDate()
  ).padStart(2,"0");

  return y+"-"+m+"-"+d;

}


function getMonday(value){

  let date = new Date(
    value+"T12:00:00"
  );

  if(isNaN(date.getTime())){

    date = new Date();

  }

  const day = date.getDay();

  const difference =
    day === 0
    ? -6
    : 1-day;

  date.setDate(
    date.getDate()+difference
  );

  return date;

}


function formatDate(value){

  const date = new Date(
    value+"T12:00:00"
  );

  return date.toLocaleDateString(
    "es-ES",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}


function weekText(start){

  const first = new Date(
    start+"T12:00:00"
  );

  const last = new Date(first);

  last.setDate(
    last.getDate()+6
  );

  return formatDate(start)
  +" → "
  +formatDate(localDate(last));

}


function escapeHTML(value){

  return String(value || "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function totalHours(part){

  return part.days.reduce(
    function(total,day){

      if(!day.worked){

        return total;

      }

      return total +
      (Number(day.hours) || 0);

    },
    0
  );

}


function showToast(message){

  const toast =
    document.createElement("div");

  toast.className="toast";

  toast.textContent=message;

  document.body.appendChild(toast);

  setTimeout(
    function(){

      toast.remove();

    },
    1800
  );

}


/* =========================
   NUEVO PARTE
========================= */

function createNewPart(start){

  const monday =
    getMonday(start);

  const days=[];

  for(let i=0;i<7;i++){

    const date =
      new Date(monday);

    date.setDate(
      monday.getDate()+i
    );

    days.push({

      date:localDate(date),

      worked:i<5,

      hours:i<5 ? 8 : "",

      obra:"",

      obs:""

    });

  }

  return {

    id:createId(),

    name:"Santiago Román",

    start:localDate(monday),

    days:days

  };

}


/* =========================
   INICIO
========================= */

function renderHome(){

  currentPage="home";

  const parts =
    getParts().sort(
      function(a,b){

        return b.start.localeCompare(
          a.start
        );

      }
    );

  const total =
    parts.reduce(
      function(sum,part){

        return sum +
        totalHours(part);

      },
      0
    );


  let history="";


  if(parts.length===0){

    history=`

      <div class="empty">

        Todavía no tienes
        partes guardados.

      </div>

    `;

  }else{

    history =
      parts.map(
        renderHistoryItem
      ).join("");

  }


  document.getElementById(
    "app"
  ).innerHTML=`

<header>

<h1>
📋 Parte De Santiago Román
</h1>

<div class="muted">
Control de horas y obras
</div>

</header>


<div class="card">

<h2>
Crear nuevo parte
</h2>


<div class="field">

<label>
Semana
</label>

<input
id="newWeek"
type="date"
value="${localDate(
getMonday(
new Date()
)
)}"
>

</div>


<button
class="green"
onclick="createPart()"
>

➕ Crear parte

</button>


<div style="margin-top:9px">

<button
class="light"
onclick="addWorkFromHome()"
>

🏗️ Añadir obra

</button>

</div>

</div>


<div class="card">

<h2>
Resumen
</h2>

<div class="grid">

<div>

<div class="muted">
Partes guardados
</div>

<b style="font-size:25px">
${parts.length}
</b>

</div>


<div>

<div class="muted">
Horas registradas
</div>

<b style="font-size:25px">
${total} h
</b>

</div>

</div>

</div>


<div class="card">

<h2>
Historial
</h2>

${history}

</div>

`;

}


function renderHistoryItem(part){

  const works = [
    ...new Set(
      part.days
      .filter(
        day =>
        day.worked &&
        day.obra
      )
      .map(
        day=>day.obra
      )
    )
  ];

  return `

<div class="week">

<div class="week-title">

${escapeHTML(
weekText(part.start)
)}

</div>


<div class="week-info">

${totalHours(part)}
horas

·

${
works.length
?
"Obras: "+works.join(", ")
:
"Sin obra"
}

</div>


<div class="week-buttons">

<button
class="light"
onclick="editPart('${part.id}')"
>

✏️ Editar

</button>


<button
class="blue"
onclick="printPart('${part.id}')"
>

📄 PDF

</button>


<button
class="red"
onclick="deletePart('${part.id}')"
>

🗑️

</button>

</div>

</div>

`;

}


/* =========================
   CREAR PARTE
========================= */

function createPart(){

  const start =
    document.getElementById(
      "newWeek"
    ).value;

  if(!start){

    alert(
      "Selecciona una semana."
    );

    return;

  }

  currentPart =
    createNewPart(start);

  editingId=null;

  renderEditor();

}


/* =========================
   EDITAR PARTE
========================= */

function editPart(id){

  const parts =
    getParts();

  const part =
    parts.find(
      p=>p.id===id
    );

  if(!part){

    return;

  }

  currentPart =
    JSON.parse(
      JSON.stringify(part)
    );

  editingId=id;

  renderEditor();

}


/* =========================
   EDITOR
========================= */

function renderEditor(){

  currentPage="editor";

  const works =
    getWorks();

  document.getElementById(
    "app"
  ).innerHTML=`

<header>

<h1>

${
editingId
?
"✏️ Editar parte"
:
"➕ Nuevo parte"
}

</h1>

<div class="muted">

${escapeHTML(
weekText(
currentPart.start
)
)}

</div>

</header>


<div class="card">

<div class="grid">


<div class="field">

<label>
Nombre
</label>

<input
id="partName"
value="${escapeHTML(
currentPart.name
)}"
>

</div>


<div class="field">

<label>
Semana
</label>

<input
id="partStart"
type="date"
value="${currentPart.start}"
onchange="changePartWeek(this.value)"
>

</div>

</div>


<div class="notice">

Lunes a viernes están marcados
automáticamente.

Si trabajaste sábado o domingo,
marca <b>Trabajé</b>.

Puedes poner una obra y horas
diferentes cada día.

</div>

</div>


<div class="card">

<h2>
Jornadas
</h2>


${currentPart.days
.map(
function(day,index){

return renderDay(
day,
index,
works
);

}
)
.join("")}


<div class="total">

<span>
Total
</span>

<span class="total-number">

${totalHours(currentPart)}
h

</span>

</div>

</div>


<div class="card">

<button
class="green"
onclick="saveAndReturn()"
>

💾 Guardar y volver al inicio

</button>


<div style="margin-top:9px">

<button
class="blue"
onclick="printCurrentPart()"
>

📄 Ver / imprimir PDF

</button>

</div>


<div style="margin-top:9px">

<button
class="light"
onclick="renderHome()"
>

Cancelar

</button>

</div>

</div>


<div class="card">

<h2>
Añadir obra
</h2>


<div class="grid">

<div>

<input
id="newWork"
inputmode="numeric"
placeholder="Número de obra"
>

</div>


<button
class="dark"
onclick="addWorkFromEditor()"
>

Añadir obra

</button>

</div>

</div>

`;

}


/* =========================
   DÍA
========================= */

function renderDay(
  day,
  index,
  works
){

  return `

<div
class="day ${
day.worked
?
""
:
"off"
}"
>


<div class="day-top">

<div class="day-name">

${DAYS[index]}

·

${formatDate(day.date)}

</div>


<label class="check">

<input
type="checkbox"
${day.worked?"checked":""}
onchange="
toggleDay(
${index},
this.checked
)
"
>

Trabajé

</label>

</div>


<div class="day-fields">


<div class="field">

<label>
Horas
</label>

<input
type="number"
min="0"
step="0.5"
value="${escapeHTML(
day.hours
)}"
${day.worked?"":"disabled"}
onchange="
changeDay(
${index},
'hours',
this.value
)
"
>

</div>


<div class="field">

<label>
Obra
</label>

<select
${day.worked?"":"disabled"}
onchange="
changeDay(
${index},
'obra',
this.value
)
"
>

<option value="">
Selecciona obra
</option>


${works
.map(
function(work){

return `

<option
value="${escapeHTML(work)}"
${
work===day.obra
?
"selected"
:
""
}
>

${escapeHTML(work)}

</option>

`;

}
)
.join("")}

</select>

</div>

</div>


<div class="field">

<label>
Observaciones
</label>

<input
placeholder="Opcional"
value="${escapeHTML(
day.obs
)}"
${day.worked?"":"disabled"}
onchange="
changeDay(
${index},
'obs',
this.value
)
"
>

</div>

</div>

`;

}


/* =========================
   CAMBIAR DÍA
========================= */

function changeDay(
  index,
  field,
  value
){

  currentPart.days[index][field]=
    value;

  renderEditor();

}


/* =========================
   ACTIVAR DÍA
========================= */

function toggleDay(
  index,
  checked
){

  currentPart.days[index].worked=
    checked;


  if(!checked){

    currentPart.days[index].hours="";

    currentPart.days[index].obra="";

    currentPart.days[index].obs="";

  }

  renderEditor();

}


/* =========================
   CAMBIAR SEMANA
========================= */

function changePartWeek(
  value
){

  const monday =
    getMonday(value);

  currentPart.start=
    localDate(monday);


  for(let i=0;i<7;i++){

    const date =
      new Date(monday);

    date.setDate(
      monday.getDate()+i
    );

    currentPart.days[i].date=
      localDate(date);

  }


  renderEditor();

}


/* =========================
   GUARDAR
========================= */

function saveAndReturn(){

  const name =
    document.getElementById(
      "partName"
    ).value.trim();


  currentPart.name =
    name || "Santiago Román";


  const selectedDate =
    document.getElementById(
      "partStart"
    ).value;


  if(selectedDate){

    currentPart.start =
      localDate(
        getMonday(
          selectedDate
        )
      );

  }


  const parts =
    getParts();


  const index =
    parts.findIndex(
      p=>p.id===currentPart.id
    );


  const copy =
    JSON.parse(
      JSON.stringify(
        currentPart
      )
    );


  if(index===-1){

    parts.push(copy);

  }else{

    parts[index]=copy;

  }


  saveParts(parts);


  showToast(
    "Parte guardado correctamente"
  );


  setTimeout(
    function(){

      currentPart=null;

      editingId=null;

      renderHome();

    },
    700
  );

}


/* =========================
   OBRAS
========================= */

function addWorkFromHome(){

  const work =
    prompt(
      "Número de obra:"
    );


  if(!work){

    return;

  }


  const value =
    work.trim();


  if(!value){

    return;

  }


  const works =
    getWorks();


  if(!works.includes(value)){

    works.push(value);

    saveWorks(works);

  }


  showToast(
    "Obra "+value+" añadida"
  );

}


function addWorkFromEditor(){

  const input =
    document.getElementById(
      "newWork"
    );


  const value =
    input.value.trim();


  if(!value){

    alert(
      "Escribe el número de obra."
    );

    return;

  }


  const works =
    getWorks();


  if(!works.includes(value)){

    works.push(value);

    saveWorks(works);

  }


  input.value="";


  renderEditor();


  showToast(
    "Obra añadida"
  );

}


/* =========================
   BORRAR
========================= */

function deletePart(id){

  if(
    !confirm(
      "¿Quieres borrar este parte?"
    )
  ){

    return;

  }


  const parts =
    getParts()
    .filter(
      p=>p.id!==id
    );


  saveParts(parts);


  renderHome();

}


/* =========================
   PDF
========================= */

function preparePrint(
  part
){

  const workedDays =
    part.days.filter(
      d=>d.worked
    );


  let rows="";


  workedDays.forEach(
    function(day){

      const index =
        part.days.indexOf(
          day
        );


      rows+=`

<tr>

<td>
<b>
${DAYS[index]}
</b>
</td>

<td>
${formatDate(day.date)}
</td>

<td>
${escapeHTML(day.hours)}
h
</td>

<td>
${escapeHTML(day.obra)}
</td>

<td>
${escapeHTML(day.obs)}
</td>

</tr>

`;

    }
  );


  if(!rows){

    rows=`

<tr>

<td
colspan="5"
style="text-align:center"
>

No hay días trabajados.

</td>

</tr>

`;

  }


  document.getElementById(
    "print"
  ).innerHTML=`

<h1>
PARTE DE SANTIAGO ROMÁN
</h1>


<div class="print-info">

<div>

<b>
Nombre:
</b>

${escapeHTML(
part.name
)}

</div>


<div>

<b>
Semana:
</b>

${escapeHTML(
weekText(
part.start
)
)}

</div>

</div>


<table>

<thead>

<tr>

<th>
Día
</th>

<th>
Fecha
</th>

<th>
Horas
</th>

<th>
Obra
</th>

<th>
Observaciones
</th>

</tr>

</thead>


<tbody>

${rows}

</tbody>

</table>


<div class="print-total">

TOTAL:
${totalHours(part)}
horas

</div>

`;

}


function printCurrentPart(){

  preparePrint(
    currentPart
  );

  window.print();

}


function printPart(id){

  const part =
    getParts().find(
      p=>p.id===id
    );


  if(!part){

    return;

  }


  preparePrint(part);

  window.print();

}


/* =========================
   ARRANCAR
========================= */

renderHome();

</script>

</body>
</html>
