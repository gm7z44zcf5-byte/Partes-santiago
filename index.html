<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>Parte De Santiago Román</title>

<style>
:root{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
--bg:#f4f4f7;
--card:#fff;
--ink:#111;
--muted:#6b7280;
--line:#e5e7eb;
--green:#16843d;
--blue:#1769d1;
--red:#b42318;
}

*{
box-sizing:border-box;
}

body{
margin:0;
background:var(--bg);
color:var(--ink);
}

button,input,select{
font:inherit;
}

button{
cursor:pointer;
}

.app{
max-width:760px;
margin:auto;
padding:15px 14px 35px;
}

header{
padding:8px 2px 18px;
}

h1{
font-size:26px;
margin:0;
}

h2{
font-size:19px;
margin:0 0 14px;
}

.muted{
color:var(--muted);
}

.card{
background:var(--card);
border-radius:20px;
padding:18px;
margin-bottom:14px;
box-shadow:0 4px 18px #0000000c;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.field{
margin-bottom:12px;
}

.field label{
display:block;
font-size:13px;
font-weight:750;
margin-bottom:6px;
}

input,
select{
width:100%;
padding:12px;
border:1px solid #d1d5db;
border-radius:12px;
background:#fff;
}

button{
border:0;
border-radius:13px;
padding:13px 15px;
font-weight:750;
}

.primary{
background:#111;
color:#fff;
}

.green{
background:var(--green);
color:#fff;
}

.blue{
background:var(--blue);
color:#fff;
}

.light{
background:#eef0f3;
color:#111;
}

.red{
background:#fee4e2;
color:var(--red);
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
}

.actions.one{
grid-template-columns:1fr;
}

.notice{
padding:12px;
border-radius:12px;
background:#eef6ff;
color:#174a8b;
font-size:13px;
margin-top:3px;
}

.home-stat{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
background:#f7f7f8;
border-radius:14px;
padding:14px;
}

.stat b{
display:block;
font-size:22px;
margin-top:3px;
}

.week-card{
border:1px solid var(--line);
border-radius:15px;
padding:14px;
margin-top:10px;
}

.week-head{
display:flex;
justify-content:space-between;
gap:10px;
}

.badge{
background:#eee;
border-radius:999px;
padding:5px 9px;
font-size:12px;
font-weight:750;
height:max-content;
}

.week-actions{
display:flex;
gap:8px;
margin-top:10px;
}

.week-actions button{
flex:1;
}

.day{
border:1px solid var(--line);
border-radius:15px;
padding:14px;
margin:10px 0;
}

.day.off{
opacity:.48;
background:#fafafa;
}

.daytop{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
margin-bottom:10px;
}

.dayname{
font-weight:800;
}

.check{
display:flex;
align-items:center;
gap:7px;
font-size:13px;
font-weight:700;
}

.check input{
width:20px;
height:20px;
}

.daygrid{
display:grid;
grid-template-columns:100px 1fr;
gap:10px;
}

.daygrid2{
display:grid;
grid-template-columns:1fr 1.5fr;
gap:10px;
}

.totalbar{
display:flex;
justify-content:space-between;
align-items:center;
border-top:1px solid var(--line);
padding-top:14px;
margin-top:14px;
font-weight:800;
}

.totalnum{
font-size:25px;
}

.empty{
text-align:center;
padding:25px;
color:var(--muted);
}

.small{
font-size:12px;
}

.toast{
position:fixed;
left:14px;
right:14px;
bottom:18px;
background:#111;
color:#fff;
border-radius:14px;
padding:14px;
text-align:center;
z-index:20;
box-shadow:0 8px 30px #0004;
}

/* PDF */

.print{
display:none;
}

@media(max-width:600px){

.grid,
.daygrid,
.daygrid2,
.actions{
grid-template-columns:1fr;
}

.week-actions{
flex-direction:column;
}

}

@media print{

@page{
size:A4;
margin:12mm;
}

body{
background:#fff;
}

.app{
display:none!important;
}

.print{
display:block!important;
font-family:Arial,sans-serif;
color:#111;
}

.print h1{
text-align:center;
font-size:21px;
margin:0 0 12px;
}

.meta{
display:grid;
grid-template-columns:1.5fr 1fr;
border:1px solid #111;
}

.meta div{
padding:7px;
border-right:1px solid #111;
font-size:11px;
}

.meta div:last-child{
border:0;
}

table{
width:100%;
border-collapse:collapse;
margin-top:14px;
font-size:10.5px;
}

th,
td{
border:1px solid #111;
padding:6px;
vertical-align:top;
}

th{
background:#eee;
}

.print-total{
text-align:right;
font-weight:800;
margin-top:8px;
font-size:12px;
}

}
</style>
</head>

<body>

<div id="app" class="app"></div>

<div id="print" class="print"></div>


<script>

const KEY="santiago_partes_v2";

const WORKS_KEY="santiago_obras_v2";

const DAYS=[
"Lunes",
"Martes",
"Miércoles",
"Jueves",
"Viernes",
"Sábado",
"Domingo"
];

let screen="home";

let draft=null;

let editingId=null;


/* =========================
   FUNCIONES GENERALES
========================= */

function uid(){

return Date.now().toString(36)+"-"+
Math.random().toString(36).slice(2,8);

}


function iso(d){

return new Date(d).toISOString().slice(0,10);

}


function monday(v){

let d=new Date(v+"T12:00:00");

let n=d.getDay();

d.setDate(
d.getDate()-(n===0?6:n-1)
);

return d;

}


function fmt(v){

return new Date(v+"T12:00:00")
.toLocaleDateString(
"es-ES",
{
day:"2-digit",
month:"2-digit",
year:"numeric"
}
);

}


function weekText(v){

let s=new Date(v+"T12:00:00");

let e=new Date(s);

e.setDate(e.getDate()+6);

return fmt(v)+" → "+fmt(iso(e));

}


function esc(v){

return String(v??"")
.replace(/[&<>"']/g,m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[m]));

}


/* =========================
   DATOS
========================= */

function getParts(){

return JSON.parse(
localStorage.getItem(KEY)||"[]"
);

}


function setParts(a){

localStorage.setItem(
KEY,
JSON.stringify(a)
);

}


function getWorks(){

let a=JSON.parse(
localStorage.getItem(WORKS_KEY)||"[]"
);

["10043","30339"].forEach(x=>{

if(!a.includes(x)){
a.push(x);
}

});

localStorage.setItem(
WORKS_KEY,
JSON.stringify(a)
);

return a;

}


function setWorks(a){

localStorage.setItem(
WORKS_KEY,
JSON.stringify(a)
);

}


function toast(t){

let x=document.createElement("div");

x.className="toast";

x.textContent=t;

document.body.appendChild(x);

setTimeout(
()=>x.remove(),
1800
);

}


/* =========================
   NUEVO PARTE
========================= */

function newDraft(v){

let s=monday(v);

let days=[];

for(let i=0;i<7;i++){

let d=new Date(s);

d.setDate(
s.getDate()+i
);

days.push({

date:iso(d),

worked:i<5,

hours:i<5?8:"",

obra:"",

obs:""

});

}

return{

id:uid(),

start:iso(s),

name:"Santiago Román",

days:days

};

}


/* =========================
   TOTAL
========================= */

function total(p){

return p.days.reduce(
(s,d)=>
s+
(
d.worked
?
Number(d.hours)||0
:
0
),
0
);

}


/* =========================
   PANTALLA
========================= */

function render(){

if(screen==="home"){

home();

}else{

editor();

}

}


/* =========================
   INICIO
========================= */

function home(){

const app=
document.getElementById("app");

const parts=
getParts()
.sort(
(a,b)=>
b.start.localeCompare(a.start)
);

const hours=
parts.reduce(
(s,p)=>
s+total(p),
0
);

app.innerHTML=`

<header>

<h1>
📋 Parte De Santiago Román
</h1>

<div class="muted">
Control de horas y obras
</div>

</header>


<div class="card">

<h2>
Crear un nuevo parte
</h2>

<div class="field">

<label>
Semana
</label>

<input
id="newDate"
type="date"
value="${iso(monday(new Date()))}"
>

</div>


<div class="actions one">

<button
class="green"
onclick="startNew()"
>

➕ Crear parte

</button>

</div>


<div style="margin-top:9px">

<button
class="light"
style="width:100%"
onclick="manageWorks()"
>

🏗️ Añadir / gestionar obras

</button>

</div>

</div>


<div class="card">

<h2>
Resumen
</h2>

<div class="home-stat">

<div class="stat">

<span class="muted small">
Partes guardados
</span>

<b>
${parts.length}
</b>

</div>


<div class="stat">

<span class="muted small">
Horas totales
</span>

<b>
${hours} h
</b>

</div>

</div>

</div>


<div class="card">

<h2>
Historial
</h2>

${
parts.length
?
parts.map(card).join("")
:
'<div class="empty">Todavía no hay partes guardados.</div>'
}

</div>

`;

}


/* =========================
   TARJETA PARTE
========================= */

function card(p){

let works=[
...new Set(
p.days
.filter(d=>d.worked&&d.obra)
.map(d=>d.obra)
)
];

return`

<div class="week-card">

<div class="week-head">

<div>

<b>
${esc(weekText(p.start))}
</b>

<div class="muted small">

${total(p)}
horas ·
${works.length
?
works.join(", ")
:
"sin obra"}

</div>

</div>


<span class="badge">

${total(p)} h

</span>

</div>


<div class="week-actions">

<button
class="light"
onclick="edit('${p.id}')"
>

✏️ Editar

</button>


<button
class="blue"
onclick="makePDF('${p.id}')"
>

📄 PDF

</button>


<button
class="red"
onclick="del('${p.id}')"
>

🗑️

</button>

</div>

</div>

`;

}


/* =========================
   CREAR
========================= */

function startNew(){

let v=
document.getElementById(
"newDate"
).value;

if(!v)return;

draft=newDraft(v);

editingId=null;

screen="editor";

render();

}


/* =========================
   EDITAR
========================= */

function edit(id){

let p=
getParts()
.find(
x=>x.id===id
);

if(!p)return;

draft=
JSON.parse(
JSON.stringify(p)
);

editingId=id;

screen="editor";

render();

}


/* =========================
   EDITOR
========================= */

function editor(){

const app=
document.getElementById(
"app"
);

const works=
getWorks();


app.innerHTML=`

<header>

<h1>

${
editingId
?
"✏️ Editar parte"
:
"➕ Nuevo parte"
}

</h1>

<div class="muted">

${esc(
weekText(draft.start)
)}

</div>

</header>


<div class="card">

<div class="grid">


<div class="field">

<label>
Nombre
</label>

<input
id="name"
value="${esc(draft.name)}"
>

</div>


<div class="field">

<label>
Semana
</label>

<input
id="start"
type="date"
value="${draft.start}"
onchange="changeWeek(this.value)"
>

</div>


</div>


<div class="notice">

Lunes a viernes vienen marcados.

Si trabajas sábado o domingo,
marca <b>Trabajé</b>.

Cada día puede tener
horas y obra diferentes.

</div>

</div>


<div class="card">

<h2>
Jornadas
</h2>


${draft.days
.map(
(d,i)=>
day(
d,
i,
works
)
)
.join("")}


<div class="totalbar">

<span>
Total
</span>

<span class="totalnum">

${total(draft)} h

</span>

</div>

</div>


<div class="card">

<div class="actions">

<button
class="green"
onclick="save()"
>

💾 Guardar y volver al inicio

</button>


<button
class="blue"
onclick="makePDFFromDraft()"
>

📄 Ver / imprimir PDF

</button>

</div>


<div style="margin-top:9px">

<button
class="light"
style="width:100%"
onclick="goHome()"
>

Cancelar

</button>

</div>

</div>


<div class="card">

<h2>
Añadir obra
</h2>


<div class="grid">


<div class="field">

<label>
Número de obra
</label>

<input
id="newWork"
inputmode="numeric"
placeholder="Ej. 30555"
>

</div>


<button
class="primary"
onclick="addWork()"
>

Añadir obra

</button>


</div>

</div>

`;

}


/* =========================
   DÍA
========================= */

function day(d,i,works){

return`

<div class="day ${d.worked?"":"off"}">

<div class="daytop">

<div class="dayname">

${DAYS[i]}
·
${fmt(d.date)}

</div>


<label class="check">

<input
type="checkbox"
${d.worked?"checked":""}
onchange="
toggle(${i},this.checked)
"
>

Trabajé

</label>

</div>


<div class="daygrid">


<div class="field">

<label>
Horas
</label>

<input
type="number"
min="0"
step="0.5"
value="${esc(d.hours)}"
${d.worked?"":"disabled"}
onchange="
setD(${i},'hours',this.value)
"
>

</div>


<div class="field">

<label>
Obra
</label>

<select
${d.worked?"":"disabled"}
onchange="
setD(${i},'obra',this.value)
"
>

<option value="">
Selecciona obra
</option>


${works
.map(
w=>
`

<option
value="${esc(w)}"
${w===d.obra?"selected":""}
>

${esc(w)}

</option>

`
)
.join("")}


</select>

</div>

</div>


<div class="daygrid2">


<div class="field">

<label>
Observaciones
</label>

<input
value="${esc(d.obs)}"
${d.worked?"":"disabled"}
onchange="
setD(${i},'obs',this.value)
"
placeholder="Opcional"
>

</div>

</div>

</div>

`;

}


/* =========================
   CAMBIAR DÍA
========================= */

function setD(i,k,v){

draft.days[i][k]=v;

editor();

}


/* =========================
   ACTIVAR DÍA
========================= */

function toggle(i,v){

draft.days[i].worked=v;

if(!v){

draft.days[i].hours="";

draft.days[i].obra="";

draft.days[i].obs="";

}

editor();

}


/* =========================
   CAMBIAR SEMANA
========================= */

function changeWeek(v){

let s=monday(v);

draft.start=iso(s);

for(let i=0;i<7;i++){

let d=new Date(s);

d.setDate(
s.getDate()+i
);

draft.days[i].date=
iso(d);

}

editor();

}


/* =========================
   GUARDAR
========================= */

function save(){

draft.name=
document.getElementById(
"name"
).value.trim()
||
"Santiago Román";


draft.start=
iso(
monday(
document.getElementById(
"start"
).value
)
);


let a=getParts();


let i=
a.findIndex(
x=>x.id===draft.id
);


if(i>=0){

a[i]=draft;

}else{

a.push(draft);

}


setParts(a);


toast(
"Parte guardado correctamente"
);


setTimeout(
()=>{

draft=null;

editingId=null;

screen="home";

render();

},
700
);

}


/* =========================
   OBRAS
========================= */

function addWork(){

let x=
document.getElementById(
"newWork"
).value.trim();


if(!x){

alert(
"Escribe el número de obra."
);

return;

}


let a=getWorks();


if(!a.includes(x)){

a.push(x);

setWorks(a);

}


toast(
"Obra añadida: "+x
);


editor();

}


function manageWorks(){

let current=
getWorks();


let x=
prompt(
"Obras actuales:\n\n"+
current.join(", ")+
"\n\nEscribe el número de una nueva obra:"
);


if(
x &&
x.trim()
){

let w=x.trim();


if(!current.includes(w)){

current.push(w);

}


setWorks(current);


toast(
"Obra añadida: "+w
);

}

}


/* =========================
   BORRAR
========================= */

function del(id){

if(
!confirm(
"¿Borrar este parte?"
)
){

return;

}


setParts(
getParts()
.filter(
p=>p.id!==id
)
);


render();

}


/* =========================
   VOLVER
========================= */

function goHome(){

draft=null;

editingId=null;

screen="home";

render();

}


/* =========================
   PDF
========================= */

function makePDF(id){

let p=
getParts()
.find(
x=>x.id===id
);


if(p){

preparePrint(p);

window.print();

}

}


function makePDFFromDraft(){

preparePrint(draft);

window.print();

}


/* =========================
   PREPARAR PDF
========================= */

function preparePrint(p){

let rows=
p.days.filter(
d=>d.worked
);

let h=
total(p);


document.getElementById(
"print"
).innerHTML=

`

<h1>
PARTE DE SANTIAGO ROMÁN
</h1>


<div class="meta">

<div>

<b>
Nombre:
</b>

${esc(p.name)}

</div>


<div>

<b>
Semana:
</b>

${esc(
weekText(p.start)
)}

</div>

</div>


<table>

<thead>

<tr>

<th>
Día
</th>

<th>
Fecha
</th>

<th>
Horas
</th>

<th>
Obra
</th>

<th>
Observaciones
</th>

</tr>

</thead>


<tbody>


${
rows.length
?

rows
.map(
d=>{

let i=
p.days.indexOf(d);


return`

<tr>

<td>
<b>
${DAYS[i]}
</b>
</td>

<td>
${fmt(d.date)}
</td>

<td>
${esc(d.hours)}
h
</td>

<td>
${esc(d.obra)}
</td>

<td>
${esc(d.obs)}
</td>

</tr>

`;

}
)
.join("")

:

`

<tr>

<td
colspan="5"
>

No hay días trabajados.

</td>

</tr>

`

}


</tbody>

</table>


<div class="print-total">

TOTAL:
${h}
horas

</div>

`;

}


/* =========================
   INICIAR
========================= */

render();

</script>

</body>
</html>
