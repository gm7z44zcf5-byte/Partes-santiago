<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Parte de horas">

<title>Parte de horas semanales</title>

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=2">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box}

:root{
 --blue:#2563eb;
 --green:#16803d;
 --red:#dc2626;
 --bg:#f2f3f7;
 --text:#111827;
 --muted:#6b7280;
}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.wrap{
 max-width:850px;
 margin:auto;
 padding:18px 12px 70px;
}

.card{
 background:#fff;
 border-radius:26px;
 padding:22px;
 margin-bottom:18px;
 box-shadow:0 5px 22px #00000012;
}

.hero{
 text-align:center;
 padding:28px 20px;
}

.hero h1{
 font-size:34px;
 line-height:1.1;
 margin:0 0 8px;
 font-weight:850;
}

.sub{
 font-size:18px;
 color:var(--muted);
 margin-bottom:24px;
}

label{
 display:block;
 font-size:16px;
 font-weight:800;
 margin:15px 0 7px;
}

input,select,textarea{
 width:100%;
 border:2px solid #ddd;
 border-radius:16px;
 padding:14px 15px;
 font:inherit;
 background:#fff;
}

input:focus,select:focus,textarea:focus{
 outline:3px solid #2563eb22;
 border-color:var(--blue);
}

button{
 border:0;
 border-radius:16px;
 padding:15px 18px;
 font:inherit;
 font-weight:800;
 cursor:pointer;
}

.btn{
 width:100%;
 margin-top:10px;
 color:#fff;
}

.blue{background:var(--blue)}
.green{background:var(--green)}
.black{background:#111}
.light{background:#eef0f4;color:#111}
.red{background:#fee2e2;color:#991b1b}

.grid2{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.week-head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 margin-bottom:15px;
}

.week-head h2{
 margin:0;
 font-size:26px;
}

.total{
 background:#eef0f4;
 border-radius:999px;
 padding:10px 16px;
 font-weight:850;
 white-space:nowrap;
}

.day{
 border-top:1px solid #e5e7eb;
 padding:20px 0;
}

.day:first-child{
 border-top:0;
}

.day-top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}

.day h3{
 margin:0;
 font-size:22px;
}

.date{
 color:var(--muted);
 font-size:14px;
 margin-top:3px;
}

.day-total{
 background:#f0f0f0;
 border-radius:999px;
 padding:9px 14px;
 font-weight:850;
}

.day-actions{
 display:flex;
 gap:9px;
 align-items:center;
 margin:15px 0 10px;
}

.day-actions input[type=checkbox]{
 width:25px;
 height:25px;
 accent-color:var(--blue);
}

.day-actions span{
 font-weight:800;
}

.lines{
 display:flex;
 flex-direction:column;
 gap:10px;
}

.line{
 background:#f7f7f8;
 border:1px solid #e1e1e1;
 border-radius:18px;
 padding:12px;
}

.linegrid{
 display:grid;
 grid-template-columns:90px 1fr 46px;
 gap:8px;
 align-items:center;
}

.linegrid input,
.linegrid select{
 padding:12px;
 border-radius:13px;
}

.remove{
 background:#eee;
 color:#b42318;
 padding:11px;
}

.addline{
 width:100%;
 background:#eef0f4;
 margin-top:10px;
}

.notes{
 margin-top:10px;
}

.summary{
 background:#111;
 color:#fff;
}

.summary h2{
 margin-top:0;
}

.summaryrow{
 display:flex;
 justify-content:space-between;
 padding:9px 0;
 border-bottom:1px solid #333;
}

.summaryrow:last-child{
 border:0;
}

.history-item{
 border:1px solid #ddd;
 border-radius:16px;
 padding:12px;
 margin-top:9px;
 background:#fafafa;
}

.history-item b{
 display:block;
}

.small{
 font-size:13px;
 color:var(--muted);
}

.hidden{
 display:none!important;
}

.toast{
 position:fixed;
 left:50%;
 bottom:22px;
 transform:translateX(-50%);
 background:#111;
 color:#fff;
 padding:13px 18px;
 border-radius:999px;
 font-weight:700;
 z-index:99;
 box-shadow:0 5px 20px #0005;
}

.print-title{
 display:none;
 text-align:center;
 margin-bottom:20px;
}

@media(max-width:600px){
 .grid2{
  grid-template-columns:1fr;
 }

 .linegrid{
  grid-template-columns:82px 1fr 43px;
 }

 .hero h1{
  font-size:31px;
 }
}

@media print{
 body{
  background:#fff;
 }

 .no-print{
  display:none!important;
 }

 .wrap{
  max-width:none;
  padding:0;
 }

 .card{
  box-shadow:none;
  border:1px solid #ddd;
  break-inside:avoid;
 }

 .day{
  break-inside:avoid;
 }

 .print-title{
  display:block!important;
 }
}
</style>
</head>

<body>

<div class="wrap">

<section class="card hero no-print">

<h1>📋 Parte de horas semanales</h1>

<div class="sub">
Control semanal de horas y obras
</div>

<label for="name">
Nombre y apellido
</label>

<input
 id="name"
 type="text"
 placeholder="Pon tu nombre y apellido"
>

<label for="weekStart">
Semana comienza
</label>

<input
 id="weekStart"
 type="date"
>

<div class="grid2">

<button
 class="btn blue"
 onclick="createWeek()"
>
Crear / actualizar semana
</button>

<button
 class="btn green"
 onclick="savePart()"
>
💾 Guardar parte
</button>

</div>

<button
 class="btn black"
 onclick="printPart()"
>
🖨️ Imprimir / PDF
</button>

<button
 class="btn light"
 onclick="newBlankWeek()"
>
➕ Nueva semana en blanco
</button>

</section>


<section class="card">

<div class="print-title">

<h1>
PARTE DE HORAS SEMANALES
</h1>

<div id="printName"></div>

<div id="printDates"></div>

</div>


<div class="week-head">

<h2>
Horas de la semana
</h2>

<div class="total">
<span id="weekTotal">0</span> h
</div>

</div>

<div id="days"></div>

</section>


<section class="card summary">

<h2>
Resumen
</h2>

<div class="summaryrow">
<span>Trabajador</span>
<b id="sumName">—</b>
</div>

<div class="summaryrow">
<span>Total semanal</span>
<b>
<span id="sumHours">0</span> h
</b>
</div>

<div class="summaryrow">
<span>Días trabajados</span>
<b>
<span id="sumDays">0</span> / 7
</b>
</div>

</section>


<section class="card no-print">

<h2>
Partes guardados
</h2>

<div class="small">
Se guardan en este dispositivo. Puedes recuperar semanas anteriores.
</div>

<div id="history"></div>

</section>

</div>


<div id="toast" class="toast hidden"></div>


<script>

const DAYS=[
 "Lunes",
 "Martes",
 "Miércoles",
 "Jueves",
 "Viernes",
 "Sábado",
 "Domingo"
];

let week={
 start:"",
 name:"",
 days:[]
};


function todayISO(){

 const d=new Date();

 return d.toISOString().slice(0,10);

}


function mondayOf(dateStr){

 const d=new Date(dateStr+"T12:00:00");

 const day=d.getDay();

 const diff=day===0?-6:1-day;

 d.setDate(d.getDate()+diff);

 return d.toISOString().slice(0,10);

}


function addDays(dateStr,n){

 const d=new Date(dateStr+"T12:00:00");

 d.setDate(d.getDate()+n);

 return d.toISOString().slice(0,10);

}


function fmt(dateStr){

 return new Date(dateStr+"T12:00:00")
 .toLocaleDateString(
  "es-ES",
  {
   day:"2-digit",
   month:"2-digit",
   year:"numeric"
  }
 );

}


function esc(s){

 return String(s??"")
 .replace(
  /[&<>"']/g,
  m=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[m])
 );

}


function blankDays(start){

 return DAYS.map((name,i)=>({

  name:name,

  date:addDays(start,i),

  worked:false,

  lines:[
   {
    hours:"",
    site:"",
    note:""
   }
  ]

 }));

}


function loadProfile(){

 const saved=
 localStorage.getItem("parte_profile_name");

 if(saved){

  document.getElementById("name").value=saved;

 }

}


function saveProfile(){

 const n=
 document.getElementById("name")
 .value
 .trim();

 if(n){

  localStorage.setItem(
   "parte_profile_name",
   n
  );

 }

}


function createWeek(){

 saveProfile();

 const start=
 mondayOf(
  document.getElementById("weekStart").value ||
  todayISO()
 );

 document.getElementById("weekStart").value=start;

 const old=
 JSON.parse(
  localStorage.getItem("parte_current") ||
  "null"
 );

 if(old && old.start===start){

  week=old;

  if(!week.days?.length){

   week.days=blankDays(start);

  }

 }else{

  week={
   start:start,
   name:document.getElementById("name").value.trim(),
   days:blankDays(start)
  };

 }

 week.name=
 document.getElementById("name").value.trim();

 render();

 toast("Semana preparada");

}


function newBlankWeek(){

 saveProfile();

 const start=
 mondayOf(
  document.getElementById("weekStart").value ||
  todayISO()
 );

 week={
  start:start,
  name:document.getElementById("name").value.trim(),
  days:blankDays(start)
 };

 document.getElementById("weekStart").value=start;

 render();

 toast("Nueva semana en blanco");

}


function render(){

 document.getElementById("name").value=
 week.name ||
 localStorage.getItem("parte_profile_name") ||
 "";

 document.getElementById("weekStart").value=
 week.start ||
 mondayOf(todayISO());

 document.getElementById("days").innerHTML=
 week.days.map(
  (d,di)=>dayHTML(d,di)
 ).join("");

 updateTotals();

 renderHistory();

}


function dayHTML(d,di){

 const total=
 d.lines.reduce(
  (a,l)=>a+(parseFloat(l.hours)||0),
  0
 );

 return `

 <div class="day">

  <div class="day-top">

   <div>

    <h3>
    ${d.name}
    </h3>

    <div class="date">
    ${fmt(d.date)}
    </div>

   </div>

   <div class="day-total">
   ${fmtNum(total)} h
   </div>

  </div>


  <div class="day-actions">

   <input
    type="checkbox"
    ${d.worked?"checked":""}
    onchange="toggleWorked(${di},this.checked)"
   >

   <span>
   Trabajé este día
   </span>

  </div>


  <div class="lines">

   ${d.lines.map(
    (l,li)=>lineHTML(d,di,l,li)
   ).join("")}

  </div>


  <button
   class="addline"
   onclick="addLine(${di})"
  >
  ＋ Añadir otra obra / línea
  </button>


  <textarea
   class="notes"
   rows="2"
   placeholder="Observación del día (opcional)"
   onchange="dayNote(${di},this.value)"
  >${esc(d.note||"")}</textarea>

 </div>

 `;

}


function lineHTML(d,di,l,li){

 return `

 <div class="line">

  <div class="linegrid">

   <input
    type="number"
    min="0"
    max="24"
    step="0.25"
    placeholder="Horas"
    value="${esc(l.hours)}"
    onchange="setLine(${di},${li},'hours',this.value)"
   >


   <input
    type="text"
    placeholder="Obra / lugar"
    value="${esc(l.site)}"
    onchange="setLine(${di},${li},'site',this.value)"
   >


   <button
    class="remove"
    onclick="removeLine(${di},${li})"
   >
   ✕
   </button>

  </div>


  <input
   style="margin-top:8px"
   type="text"
   placeholder="Observación de esta línea (opcional)"
   value="${esc(l.note)}"
   onchange="setLine(${di},${li},'note',this.value)"
  >

 </div>

 `;

}


function toggleWorked(di,v){

 week.days[di].worked=v;

 updateTotals();

}


function setLine(di,li,key,val){

 week.days[di].lines[li][key]=val;

 updateTotals();

}


function dayNote(di,val){

 week.days[di].note=val;

}


function addLine(di){

 week.days[di].lines.push({

  hours:"",
  site:"",
  note:""

 });

 render();

}


function removeLine(di,li){

 if(week.days[di].lines.length===1){

  week.days[di].lines[0]={
   hours:"",
   site:"",
   note:""
  };

 }else{

  week.days[di].lines.splice(li,1);

 }

 render();

}


function totalHours(){

 return week.days.reduce(
  (sum,d)=>
   sum+
   d.lines.reduce(
    (a,l)=>a+(parseFloat(l.hours)||0),
    0
   ),
  0
 );

}


function updateTotals(){

 const total=totalHours();

 document.getElementById("weekTotal")
 .textContent=fmtNum(total);

 document.getElementById("sumHours")
 .textContent=fmtNum(total);

 document.getElementById("sumName")
 .textContent=week.name||"—";

 document.getElementById("sumDays")
 .textContent=
 week.days.filter(
  d=>d.worked
 ).length;

 week.days.forEach((d,di)=>{

  const el=
   document.querySelectorAll(".day")[di];

  if(el){

   const total=
    d.lines.reduce(
     (a,l)=>a+(parseFloat(l.hours)||0),
     0
    );

   el.querySelector(
    ".day-total"
   ).textContent=
    fmtNum(total)+" h";

  }

 });

}


function fmtNum(n){

 return Number.isInteger(n)
 ? String(n)
 : n.toFixed(2)
 .replace(/0+$/,"")
 .replace(/\.$/,"");

}


function savePart(){

 saveProfile();

 week.name=
 document.getElementById("name")
 .value
 .trim();

 week.start=
 document.getElementById("weekStart")
 .value ||
 week.start;


localStorage.setItem(
 "parte_current",
 JSON.stringify(week)
);


const history=
 JSON.parse(
  localStorage.getItem("parte_history") ||
  "[]"
);


const copy=
 JSON.parse(
  JSON.stringify(week)
);


const idx=
 history.findIndex(
  x=>x.start===week.start
 );


if(idx>=0){

 history[idx]=copy;

}else{

 history.unshift(copy);

}


localStorage.setItem(
 "parte_history",
 JSON.stringify(
  history.slice(0,20)
 )
);


renderHistory();

toast("Parte guardado correctamente");

}


function renderHistory(){

 const h=
 JSON.parse(
  localStorage.getItem("parte_history") ||
  "[]"
 );

 document.getElementById("history").innerHTML=
 h.length
 ?
 h.map((x,i)=>`

  <div class="history-item">

   <b>
   ${esc(x.name||"Sin nombre")}
   </b>

   <span>
   ${fmt(x.start)}
   ·
   ${fmtNum(
    x.days.reduce(
     (a,d)=>
      a+
      d.lines.reduce(
       (b,l)=>b+(parseFloat(l.hours)||0),
       0
      ),
     0
    )
   )} h
   </span>


   <div
    class="grid2"
    style="margin-top:8px"
   >

    <button
     class="light"
     onclick="loadHistory(${i})"
    >
    Abrir
    </button>

    <button
     class="red"
     onclick="deleteHistory(${i})"
    >
    Eliminar
    </button>

   </div>

  </div>

 `).join("")
 :
 "<p class='small'>Todavía no hay partes guardados.</p>";

}


function loadHistory(i){

 const h=
 JSON.parse(
  localStorage.getItem("parte_history") ||
  "[]"
 );

 week=h[i];

 localStorage.setItem(
  "parte_current",
  JSON.stringify(week)
 );

 render();

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });

 toast("Parte cargado");

}


function deleteHistory(i){

 const h=
 JSON.parse(
  localStorage.getItem("parte_history") ||
  "[]"
 );

 h.splice(i,1);

 localStorage.setItem(
  "parte_history",
  JSON.stringify(h)
 );

 renderHistory();

}


function printPart(){

 saveProfile();

 if(!week.days.length){

  createWeek();

 }

 week.name=
 document.getElementById("name")
 .value
 .trim();


 document.getElementById("printName")
 .textContent=
 week.name||"";


 document.getElementById("printDates")
 .textContent=
 `Semana del ${fmt(week.start)} al ${fmt(addDays(week.start,6))}`;


 window.print();

}


function toast(msg){

 const t=
 document.getElementById("toast");

 t.textContent=msg;

 t.classList.remove("hidden");

 clearTimeout(window.toastTimer);

 window.toastTimer=
 setTimeout(
  ()=>t.classList.add("hidden"),
  1800
 );

}


document
.getElementById("name")
.addEventListener(
 "input",
 e=>{

  localStorage.setItem(
   "parte_profile_name",
   e.target.value
  );

  week.name=e.target.value;

  document.getElementById("sumName")
  .textContent=
  e.target.value||"—";

 }
);


document.getElementById("weekStart").value=
 mondayOf(todayISO());


loadProfile();


const current=
 JSON.parse(
  localStorage.getItem("parte_current") ||
  "null"
 );


if(current){

 week=current;

 document.getElementById("weekStart")
 .value=current.start;

 render();

}else{

 const start=mondayOf(todayISO());

 week={
  start:start,
  name:
   localStorage.getItem("parte_profile_name")||"",
  days:blankDays(start)
 };

 render();

}


if("serviceWorker" in navigator){

 window.addEventListener(
  "load",
  ()=>{
   navigator.serviceWorker
   .register("sw.js")
   .catch(()=>{});
  }
 );

}

</script>

</body>
</html>
