<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Parte De Santiago Román</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f2f2f7;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.app{
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  margin:5px 0 4px;
  font-size:30px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:20px;
}

.card{
  background:white;
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 2px 12px rgba(0,0,0,.07);
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:6px;
}

input,select,textarea,button{
  width:100%;
  font:inherit;
  border-radius:12px;
  border:1px solid #ccc;
  padding:12px;
}

button{
  border:0;
  background:#111;
  color:white;
  font-weight:700;
  cursor:pointer;
}

button.green{
  background:#16843d;
}

button.blue{
  background:#1769aa;
}

button.red{
  background:#c62828;
}

button.gray{
  background:#777;
}

.top-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.day{
  border-top:2px solid #ddd;
  padding:18px 0;
}

.day:first-child{
  border-top:0;
}

.day-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.day-title{
  font-size:20px;
  font-weight:800;
}

.day-total{
  background:#eee;
  border-radius:20px;
  padding:7px 14px;
  font-weight:800;
}

.entry{
  display:grid;
  grid-template-columns:100px 1fr 1fr 45px;
  gap:8px;
  margin-bottom:8px;
  align-items:center;
}

.entry input{
  min-width:0;
}

.remove{
  background:#eee;
  color:#c00;
  padding:10px 5px;
  font-size:20px;
}

.add-line{
  background:#eee;
  color:#111;
  margin-top:5px;
}

.week-total{
  background:#111;
  color:white;
  border-radius:15px;
  padding:18px;
  text-align:right;
  font-size:22px;
  font-weight:800;
}

.history-item{
  border:1px solid #ddd;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.history-buttons{
  display:flex;
  gap:6px;
}

.history-buttons button{
  width:auto;
  padding:9px 12px;
}

/* =========================
   IMPRESIÓN
========================= */

#printArea{
  display:none;
}

@media print{

  @page{
    size:A4 portrait;
    margin:12mm;
  }

  body{
    background:white;
  }

  .app{
    display:none !important;
  }

  #printArea{
    display:block !important;
  }

  .print-header{
    text-align:center;
    margin-bottom:12px;
  }

  .print-header h1{
    font-size:22px;
    margin:0 0 12px;
    font-weight:900;
  }

  .info-table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:14px;
    font-size:14px;
  }

  .info-table td{
    border:1px solid #111;
    padding:7px;
  }

  .info-label{
    font-weight:800;
    width:90px;
  }

  .parts-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    font-size:12px;
  }

  .parts-table th,
  .parts-table td{
    border:1px solid #111;
    padding:6px;
    vertical-align:top;
  }

  .parts-table th{
    text-align:center;
    font-weight:900;
    background:#eee;
  }

  .col-day{
    width:18%;
  }

  .col-hours{
    width:12%;
    text-align:center;
  }

  .col-work{
    width:35%;
  }

  .col-obs{
    width:35%;
  }

  .day-cell{
    font-weight:800;
  }

  .total-row td{
    font-weight:900;
    font-size:14px;
  }

  .signature-space{
    height:45px;
  }
}

@media(max-width:650px){

  .row{
    grid-template-columns:1fr;
  }

  .top-buttons{
    grid-template-columns:1fr;
  }

  .entry{
    grid-template-columns:80px 1fr 1fr 40px;
  }

  .day-title{
    font-size:17px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="card">

    <h1>📋 Parte De Santiago Román</h1>
    <div class="subtitle">
      Control semanal de horas y obras
    </div>

    <div class="row">

      <div>
        <label>Nombre</label>
        <input id="workerName" value="Santiago Román">
      </div>

      <div>
        <label>Semana comienza</label>
        <input id="weekStart" type="date">
      </div>

    </div>

    <div class="top-buttons">
      <button class="blue" onclick="crearParte()">
        Crear semana
      </button>

      <button class="green" onclick="guardarParte()">
        💾 Guardar parte
      </button>

      <button onclick="imprimirParte()">
        🖨️ Imprimir / PDF
      </button>
    </div>

  </div>


  <div class="card">

    <h2>Horas de la semana</h2>

    <div id="days"></div>

    <div class="week-total">
      Total semanal:
      <span id="weekTotal">0</span> horas
    </div>

  </div>


  <div class="card">

    <h2>🏗️ Obras</h2>

    <div class="row">

      <input
        id="newWork"
        placeholder="Número o nombre de obra"
      >

      <button class="green" onclick="addWork()">
        + Añadir obra
      </button>

    </div>

    <div id="workList" style="margin-top:12px"></div>

  </div>


  <div class="card">

    <h2>📁 Partes guardados</h2>

    <div id="history"></div>

  </div>

</div>


<!-- ZONA EXCLUSIVA PARA PDF / IMPRESIÓN -->

<div id="printArea">

  <div class="print-header">

    <h1>PARTE DE HORAS SEMANALES</h1>

  </div>

  <table class="info-table">

    <tr>
      <td class="info-label">Nombre</td>
      <td id="printName"></td>

      <td class="info-label">Mes</td>
      <td id="printMonth"></td>

      <td class="info-label">Año</td>
      <td id="printYear"></td>
    </tr>

  </table>


  <table class="parts-table">

    <thead>

      <tr>
        <th class="col-day">Día</th>
        <th class="col-hours">Horas</th>
        <th class="col-work">Obra</th>
        <th class="col-obs">Observaciones</th>
      </tr>

    </thead>

    <tbody id="printBody"></tbody>

  </table>

</div>


<script>

let works = JSON.parse(
  localStorage.getItem("santiago_obras") || "[]"
);

let currentWeek = [];

const dayNames = [
  "Lunes",
  "Martes",
  "Miércoles",
  "Jueves",
  "Viernes",
  "Sábado",
  "Domingo"
];


// ================================
// FECHA INICIAL
// ================================

function getMonday(date){

  const d = new Date(date);
  const day = d.getDay();

  const diff = day === 0 ? -6 : 1 - day;

  d.setDate(d.getDate() + diff);

  return d;
}


function dateInputValue(date){

  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");

  return `${y}-${m}-${d}`;
}


// ================================
// CREAR SEMANA
// ================================

function crearParte(){

  const value = document.getElementById("weekStart").value;

  if(!value){
    alert("Selecciona la fecha de inicio de la semana.");
    return;
  }

  const monday = getMonday(new Date(value + "T00:00:00"));

  currentWeek = [];

  for(let i=0;i<7;i++){

    const d = new Date(monday);

    d.setDate(monday.getDate()+i);

    currentWeek.push({

      date: dateInputValue(d),

      day: dayNames[i],

      active: i < 5,

      entries: i < 5
        ? [
            {
              hours:"",
              work:"",
              obs:""
            }
          ]
        : []

    });

  }

  renderDays();
}


// ================================
// RENDER DIAS
// ================================

function renderDays(){

  const container =
    document.getElementById("days");

  container.innerHTML = "";

  currentWeek.forEach((day,index)=>{

    const div = document.createElement("div");

    div.className = "day";

    let entriesHTML = "";

    if(day.active){

      day.entries.forEach((entry,eIndex)=>{

        entriesHTML += `

          <div class="entry">

            <input
              type="number"
              min="0"
              max="24"
              step="0.5"
              placeholder="Horas"
              value="${entry.hours}"
              oninput="
                updateEntry(
                  ${index},
                  ${eIndex},
                  'hours',
                  this.value
                )
              "
            >

            <select
              onchange="
                updateEntry(
                  ${index},
                  ${eIndex},
                  'work',
                  this.value
                )
              "
            >

              <option value="">
                Seleccionar obra
              </option>

              ${works.map(w=>`

                <option
                  value="${escapeHTML(w)}"
                  ${w===entry.work ? "selected":""}
                >
                  ${escapeHTML(w)}
                </option>

              `).join("")}

            </select>


            <input
              placeholder="Observaciones"
              value="${escapeHTML(entry.obs)}"
              oninput="
                updateEntry(
                  ${index},
                  ${eIndex},
                  'obs',
                  this.value
                )
              "
            >

            <button
              class="remove"
              onclick="
                removeEntry(
                  ${index},
                  ${eIndex}
                )
              "
            >
              ×
            </button>

          </div>

        `;

      });

    }


    div.innerHTML = `

      <div class="day-header">

        <div class="day-title">

          ${day.day}

          <small style="
            display:block;
            color:#777;
            font-size:12px;
            font-weight:500;
          ">
            ${formatDate(day.date)}
          </small>

        </div>


        <div class="day-total">

          ${day.active ? totalDay(day) : 0} h

        </div>

      </div>


      <div style="margin-bottom:10px">

        <label style="
          display:flex;
          align-items:center;
          gap:8px;
        ">

          <input
            type="checkbox"
            style="width:auto"
            ${day.active ? "checked":""}
            onchange="
              toggleDay(${index},this.checked)
            "
          >

          Trabajé este día

        </label>

      </div>


      ${
        day.active
        ?
        `
          ${entriesHTML}

          <button
            class="add-line"
            onclick="addEntry(${index})"
          >
            + Añadir otra obra / línea
          </button>
        `
        :
        `
          <div style="
            color:#999;
            padding:10px 0;
          ">
            Día no trabajado
          </div>
        `
      }

    `;

    container.appendChild(div);

  });

  updateWeekTotal();

}


// ================================
// ENTRADAS
// ================================

function addEntry(dayIndex){

  currentWeek[dayIndex].entries.push({

    hours:"",
    work:"",
    obs:""

  });

  renderDays();
}


function removeEntry(dayIndex,entryIndex){

  currentWeek[dayIndex].entries.splice(
    entryIndex,
    1
  );

  renderDays();
}


function updateEntry(
  dayIndex,
  entryIndex,
  field,
  value
){

  currentWeek[dayIndex]
    .entries[entryIndex][field] = value;

  updateWeekTotal();

  renderDays();
}


function toggleDay(index,value){

  currentWeek[index].active = value;

  if(
    value &&
    currentWeek[index].entries.length === 0
  ){

    currentWeek[index].entries.push({
      hours:"",
      work:"",
      obs:""
    });

  }

  renderDays();
}


// ================================
// TOTALES
// ================================

function totalDay(day){

  return day.entries.reduce(
    (total,e)=>{

      const n = parseFloat(e.hours);

      return total + (
        isNaN(n) ? 0 : n
      );

    },
    0
  );
}


function updateWeekTotal(){

  const total = currentWeek.reduce(
    (sum,day)=>{

      return sum + (
        day.active
        ? totalDay(day)
        : 0
      );

    },
    0
  );

  document.getElementById(
    "weekTotal"
  ).textContent = total;
}


// ================================
// OBRAS
// ================================

function addWork(){

  const input =
    document.getElementById("newWork");

  const value = input.value.trim();

  if(!value){

    alert("Escribe una obra.");

    return;
  }

  if(!works.includes(value)){

    works.push(value);

    localStorage.setItem(
      "santiago_obras",
      JSON.stringify(works)
    );

  }

  input.value = "";

  renderWorks();

  renderDays();
}


function renderWorks(){

  const list =
    document.getElementById("workList");

  if(!works.length){

    list.innerHTML =
      "<p style='color:#777'>No hay obras guardadas.</p>";

    return;
  }

  list.innerHTML = works.map(
    (w,i)=>`

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:8px 0;
        border-bottom:1px solid #eee;
      ">

        <span>${escapeHTML(w)}</span>

        <button
          class="red"
          style="width:auto;padding:7px 12px"
          onclick="deleteWork(${i})"
        >
          Eliminar
        </button>

      </div>

    `
  ).join("");
}


function deleteWork(index){

  if(
    !confirm(
      "¿Eliminar esta obra de la lista?"
    )
  ) return;

  works.splice(index,1);

  localStorage.setItem(
    "santiago_obras",
    JSON.stringify(works)
  );

  renderWorks();

  renderDays();
}


// ================================
// GUARDAR PARTE
// ================================

function guardarParte(){

  if(!currentWeek.length){

    alert("Primero crea una semana.");

    return;
  }

  const name =
    document.getElementById("workerName").value
    .trim() || "Santiago Román";

  const total = currentWeek.reduce(
    (sum,d)=>
      sum + (d.active ? totalDay(d) : 0),
    0
  );

  const id =
    Date.now().toString();

  const parte = {

    id,

    name,

    weekStart:
      currentWeek[0].date,

    total,

    days:
      JSON.parse(
        JSON.stringify(currentWeek)
      )

  };


  const history =
    JSON.parse(
      localStorage.getItem(
        "santiago_partes"
      ) || "[]"
    );


  history.unshift(parte);


  localStorage.setItem(
    "santiago_partes",
    JSON.stringify(history)
  );


  alert(
    "Parte guardado correctamente."
  );


  renderHistory();

}


// ================================
// HISTORIAL
// ================================

function renderHistory(){

  const container =
    document.getElementById("history");

  const history =
    JSON.parse(
      localStorage.getItem(
        "santiago_partes"
      ) || "[]"
    );


  if(!history.length){

    container.innerHTML =
      "<p style='color:#777'>Todavía no hay partes guardados.</p>";

    return;
  }


  container.innerHTML =
    history.map(
      p=>`

      <div class="history-item">

        <div>

          <strong>
            ${formatDate(p.weekStart)}
          </strong>

          <div style="color:#777">
            ${escapeHTML(p.name)}
            · ${p.total} horas
          </div>

        </div>


        <div class="history-buttons">

          <button
            class="blue"
            onclick="loadParte('${p.id}')"
          >
            Abrir
          </button>

          <button
            class="red"
            onclick="deleteParte('${p.id}')"
          >
            ×
          </button>

        </div>

      </div>

      `
    ).join("");
}


function loadParte(id){

  const history =
    JSON.parse(
      localStorage.getItem(
        "santiago_partes"
      ) || "[]"
    );


  const parte =
    history.find(p=>p.id===id);


  if(!parte) return;


  currentWeek =
    JSON.parse(
      JSON.stringify(parte.days)
    );


  document.getElementById(
    "workerName"
  ).value = parte.name;


  document.getElementById(
    "weekStart"
  ).value = parte.weekStart;


  renderDays();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function deleteParte(id){

  if(
    !confirm(
      "¿Eliminar este parte?"
    )
  ) return;


  let history =
    JSON.parse(
      localStorage.getItem(
        "santiago_partes"
      ) || "[]"
    );


  history =
    history.filter(
      p=>p.id!==id
    );


  localStorage.setItem(
    "santiago_partes",
    JSON.stringify(history)
  );


  renderHistory();
}


// ================================
// IMPRIMIR / PDF
// ================================

function imprimirParte(){

  if(!currentWeek.length){

    alert(
      "Primero crea una semana."
    );

    return;
  }


  const name =
    document.getElementById(
      "workerName"
    ).value
    .trim() || "Santiago Román";


  const firstDate =
    new Date(
      currentWeek[0].date +
      "T00:00:00"
    );


  const month =
    firstDate.toLocaleDateString(
      "es-ES",
      {
        month:"long"
      }
    );


  const year =
    firstDate.getFullYear();


  document.getElementById(
    "printName"
  ).textContent = name;


  document.getElementById(
    "printMonth"
  ).textContent =
    capitalize(month);


  document.getElementById(
    "printYear"
  ).textContent =
    year;


  const body =
    document.getElementById(
      "printBody"
    );


  body.innerHTML = "";


  currentWeek.forEach(day=>{

    if(!day.active){

      const tr =
        document.createElement("tr");

      tr.innerHTML = `

        <td class="day-cell">
          ${day.day}
          <br>
          <small>
            ${formatDate(day.date)}
          </small>
        </td>

        <td></td>

        <td></td>

        <td></td>

      `;

      body.appendChild(tr);

      return;
    }


    if(day.entries.length === 0){

      const tr =
        document.createElement("tr");

      tr.innerHTML = `

        <td class="day-cell">
          ${day.day}
        </td>

        <td></td>
        <td></td>
        <td></td>

      `;

      body.appendChild(tr);

      return;
    }


    day.entries.forEach(
      (entry,index)=>{

        const tr =
          document.createElement("tr");


        tr.innerHTML = `

          <td class="day-cell">

            ${
              index === 0
              ? `
                ${day.day}
                <br>
                <small>
                  ${formatDate(day.date)}
                </small>
              `
              : ""
            }

          </td>

          <td style="text-align:center">

            ${
              entry.hours || ""
            }

          </td>

          <td>

            ${
              escapeHTML(
                entry.work || ""
              )
            }

          </td>

          <td>

            ${
              escapeHTML(
                entry.obs || ""
              )
            }

          </td>

        `;


        body.appendChild(tr);

      }
    );

  });


  const total =
    currentWeek.reduce(
      (sum,d)=>
        sum + (
          d.active
          ? totalDay(d)
          : 0
        ),
      0
    );


  const totalRow =
    document.createElement("tr");


  totalRow.className =
    "total-row";


  totalRow.innerHTML = `

    <td colspan="3">
      TOTAL HORAS
    </td>

    <td style="text-align:right">
      ${total} horas
    </td>

  `;


  body.appendChild(totalRow);


  setTimeout(
    ()=>window.print(),
    300
  );

}


// ================================
// UTILIDADES
// ================================

function formatDate(dateString){

  const d =
    new Date(
      dateString + "T00:00:00"
    );


  return d.toLocaleDateString(
    "es-ES",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}


function capitalize(text){

  return text.charAt(0).toUpperCase()
    + text.slice(1);

}


function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


// ================================
// INICIO
// ================================

function iniciar(){

  const monday =
    getMonday(new Date());


  document.getElementById(
    "weekStart"
  ).value =
    dateInputValue(monday);


  renderWorks();

  renderHistory();

  crearParte();

}


iniciar();

</script>

</body>
</html>
